<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="18%" stop-color="#e2e2e0"/>
      <stop offset="34%" stop-color="#8f8f8d"/>
      <stop offset="50%" stop-color="#f5f5f3"/>
      <stop offset="66%" stop-color="#6f6f6d"/>
      <stop offset="82%" stop-color="#d8d8d6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="metalSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9c9c7"/>
      <stop offset="50%" stop-color="#f5f5f3"/>
      <stop offset="100%" stop-color="#9a9a98"/>
    </linearGradient>

    <linearGradient id="edgeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#4a4a48"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tightGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="90" fill="none" stroke="url(#edgeStroke)" stroke-width="1.4" opacity="0.55"/>

  <g filter="url(#softGlow)">
    <polygon points="222,120 256,72 290,120" fill="url(#metal)" stroke="url(#edgeStroke)" stroke-width="1.5"/>
    <polygon points="222,120 256,120 238,168" fill="url(#metalSoft)" stroke="url(#edgeStroke)" stroke-width="1"/>
    <polygon points="256,120 290,120 274,168" fill="#dcdcda" stroke="url(#edgeStroke)" stroke-width="1"/>
    <polygon points="238,168 256,120 274,168 256,200" fill="url(#metal)" stroke="url(#edgeStroke)" stroke-width="1.3"/>
    <line x1="222" y1="120" x2="290" y2="120" stroke="#050505" stroke-width="1" opacity="0.5"/>
  </g>

  <g filter="url(#tightGlow)">
    <path d="M256,205
             C205,205 178,240 178,285
             C178,342 218,382 256,420
             C294,382 334,342 334,285
             C334,240 307,205 256,205 Z"
          fill="none" stroke="url(#metal)" stroke-width="4.5" opacity="0.9"/>
  </g>

  <g filter="url(#tightGlow)">
    <path d="M190 235
             C190 200 218 178 256 178
             C294 178 322 200 322 235
             L322 350
             C322 372 305 388 283 388
             L283 300
             C283 285 271 274 256 274
             C241 274 229 285 229 300
             L229 388
             C207 388 190 372 190 350
             Z"
          fill="url(#metal)" stroke="url(#edgeStroke)" stroke-width="2"/>
    <path d="M283 300
             L322 388
             L283 388 Z"
          fill="url(#metalSoft)" stroke="url(#edgeStroke)" stroke-width="1.5"/>
  </g>

  <ellipse cx="222" cy="215" rx="6" ry="10" fill="#ffffff" opacity="0.75" filter="url(#tightGlow)"/>
  <circle cx="300" cy="230" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="245" cy="340" r="2.4" fill="#ffffff" opacity="0.5"/>
</svg>
